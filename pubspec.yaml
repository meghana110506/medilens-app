name: medilens
description: "An offline-first Flutter app for medicine scanning with bilingual OCR"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_translation: ^0.12.0
  flutter_tts: ^4.0.2
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  geolocator: ^11.0.0
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.5.2
  go_router: ^13.2.1
  provider: ^6.1.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/drugs.db
    - assets/
    