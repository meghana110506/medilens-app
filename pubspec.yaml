name: medilens
description: "An offline-first Flutter app for medicine scanning with bilingual OCR"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_tts: ^4.0.2
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  go_router: ^13.2.1
  provider: ^6.1.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  lottie: ^3.1.0
  path: ^1.9.0
  camera: ^0.10.6
  google_mlkit_text_recognition: ^0.14.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  intl: ^0.20.2
  geolocator: ^14.0.2
  flutter_timezone: ^5.0.2
  flutter_sms: 3.0.1
  permission_handler: ^11.3.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/drugs.db
    - assets/icon/logo.png

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#0A0F1E"
  adaptive_icon_foreground: "assets/icon/logo.png"
